apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/srshyam/aws-eks-gitops.git
    targetRevision: petclinic-eks-helm-autoscaling
    path: charts/petclinic
    helm:
      valueFiles:
        - values.yaml
        - ../../environments/prod/values-common.yaml
        - ../../environments/prod/values-rest.yaml
        - ../../environments/prod/values-angular.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-prod
  syncPolicy:
    automated:
      prune: false     # Set to false for prod safety to prevent accidental deletions
      selfHeal: true   # Corrects manual drift in the cluster back to Git state
    syncOptions:
      - CreateNamespace=true