apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/srshyam/aws-eks-gitops.git
    targetRevision: petclinic-eks-helm-autoscaling
    path: charts/petclinic
    helm:
      valueFiles:
        - values.yaml
        - ../../environments/dev/values-common.yaml
        - ../../environments/dev/values-rest.yaml
        - ../../environments/dev/values-angular.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
