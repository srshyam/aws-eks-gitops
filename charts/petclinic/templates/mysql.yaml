apiVersion: v1
kind: Service
metadata:
  name: petclinic-mysql
  labels:
    app: petclinic-mysql
spec:
  ports:
  - port: {{ .Values.mysql.port }}
    name: mysql
  clusterIP: None
  selector:
    app: petclinic-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: petclinic-mysql
spec:
  serviceName: petclinic-mysql
  replicas: 1
  selector:
    matchLabels:
      app: petclinic-mysql
  template:
    metadata:
      labels:
        app: petclinic-mysql
    spec:
      containers:
      - name: mysql
        image: {{ .Values.mysql.image }}
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: {{ .Values.mysql.rootPassword | quote }}
        - name: MYSQL_DATABASE
          value: {{ .Values.mysql.database | quote }}
        - name: MYSQL_USER
          value: {{ .Values.mysql.user | quote }}
        - name: MYSQL_PASSWORD
          value: {{ .Values.mysql.password | quote }}
        ports:
        - containerPort: {{ .Values.mysql.port }}
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
          subPath: data
        resources:
          {{- toYaml .Values.mysql.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: {{ .Values.mysql.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.mysql.storage }}
